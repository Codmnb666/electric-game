name: Build APK with Buildozer
on: [push, workflow_dispatch] # 推送代码或手动触发

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          workdir: . # 如果 buildozer.spec 不在根目录，修改此处路径

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: ${{ steps.buildozer.outputs.filename }} # 自动定位生成的 APK 路径
