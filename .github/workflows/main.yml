name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 获取代码
      uses: actions/checkout@v4

    - name: 2. 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 设置 Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 4. 安装所有底层依赖
      run: |
        sudo apt-get update
        # 补齐了 libltdl-dev 等编译必需库
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev
        # 强制锁定 Cython 低于 3.0，否则 pygame 必报错
        pip3 install --upgrade pip
        pip3 install "Cython<3.0" "buildozer==1.5.0" virtualenv

    - name: 5. 开始打包 (清理缓存)
      run: |
        # 删掉可能污染的缓存
        rm -rf ~/.buildozer
        # 开始打包 (第一次需要20-30分钟)
        buildozer -v android debug

    - name: 6. 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: CircuitLab-APK
        path: bin/*.apk
        if-no-files-found: error
